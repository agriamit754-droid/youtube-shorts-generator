<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShortsAI - Video Generator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090914;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
  color: #a78bfa;
  border-bottom: 1px solid #292943;
}

.container {
  max-width: 600px;
  margin: 55px auto;
  padding: 25px;
}

h1 {
  text-align: center;
}

p {
  color: #aaa;
  text-align: center;
}

label {
  display: block;
  margin-top: 22px;
  margin-bottom: 9px;
}

input, select {
  width: 100%;
  padding: 15px;
  background: #17172a;
  color: white;
  border: 1px solid #444466;
  border-radius: 9px;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 28px;
  padding: 16px;
  background: #8055ed;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 18px;
  font-weight: bold;
}

button:disabled {
  opacity: 0.6;
}

#result {
  margin-top: 25px;
  padding: 15px;
  background: #17172a;
  border-radius: 9px;
  text-align: center;
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  color: #777;
  padding: 25px;
}
</style>
</head>

<body>

<header>⚡ ShortsAI</header>

<div class="container">

<h1>Create Amazing Shorts</h1>

<p>Turn your video ideas into YouTube Shorts.</p>

<label for="videoURL">YouTube Video URL</label>

<input
  id="videoURL"
  type="url"
  placeholder="Paste your YouTube link here"
>

<label for="count">Number of Shorts</label>

<select id="count">
  <option value="3">3 Shorts</option>
  <option value="5">5 Shorts</option>
  <option value="10">10 Shorts</option>
</select>

<label for="duration">Clip Duration</label>

<select id="duration">
  <option value="30">30 Seconds</option>
  <option value="45">45 Seconds</option>
  <option value="60">60 Seconds</option>
</select>

<button id="generateBtn" onclick="generate()">
  Generate Shorts 🚀
</button>

<div id="result">
  Your Shorts will appear here.
</div>

</div>

<footer>ShortsAI © 2026</footer>

<script>

const BACKEND_URL =
"https://shortsai-backend.amit6018158.workers.dev";

async function generate() {

  const url = document.getElementById("videoURL").value.trim();

  const count = document.getElementById("count").value;

  const duration = document.getElementById("duration").value;

  const result = document.getElementById("result");

  const button = document.getElementById("generateBtn");

  if (!url) {
    result.innerText = "Please enter a YouTube URL.";
    return;
  }

  if (!/(youtube\.com|youtu\.be)/i.test(url)) {
    result.innerText = "Please enter a valid YouTube URL.";
    return;
  }

  button.disabled = true;
  button.innerText = "Connecting...";

  result.innerText = "Connecting to ShortsAI backend...";

  try {

    const response = await fetch(BACKEND_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        videoUrl: url,
        numberOfShorts: count,
        duration: duration
      })

    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error("Backend request failed");
    }

    result.innerText =
      "✅ " + data.message +
      "\n\nBackend connection successful!";

  } catch (error) {

    result.innerText =
      "❌ Connection failed. Please try again.";

    console.error(error);

  }

  button.disabled = false;
  button.innerText = "Generate Shorts 🚀";

}

</script>

</body>
    </html>
