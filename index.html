<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shorts Generator</title>

    <style>
        body {
            background: #10101c;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 15px;
        }

        .container {
            max-width: 500px;
            margin: 70px auto;
            background: #1c1c30;
            padding: 30px;
            border-radius: 20px;
        }

        h1 {
            color: #a78bfa;
        }

        input {
            width: 90%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            margin: 15px 0;
        }

        button {
            background: #7c3aed;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🎬 AI Shorts Generator</h1>

    <p>Turn long YouTube videos into Shorts automatically.</p>

    <input type="url" placeholder="Paste YouTube video URL">

    <br>

    <button onclick="generate()">Generate Shorts 🚀</button>

    <p id="result"></p>
</div>

<script>
function generate() {
    document.getElementById("result").innerText =
    "Your AI Shorts Generator is coming soon! 🚀";
}
</script>

</body>
  </html>
